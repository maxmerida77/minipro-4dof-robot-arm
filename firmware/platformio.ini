; PlatformIO opcional (también puedes abrir `minipro_b2_stealth/minipro_b2_stealth.ino` directo en Arduino IDE)
[platformio]
src_dir = minipro_b2_stealth

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library@^3.0.2

[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library@^3.0.2
